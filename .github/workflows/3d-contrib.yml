name: Generate 3D Contribution Calendar

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "profile-3d-contrib/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: akshajtiwari
          SETTING_JSON: .github/profile-3d-contrib-purple.json

      - name: Commit generated calendar
        run: |
          git config user.name "Akshaj Tiwari"
          git config user.email "185712941+akshajtiwari@users.noreply.github.com"
          git add profile-3d-contrib/profile-purple-animate.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update 3D contribution calendar"
            git push
          fi
